version: '3.9'

services:
  traefik:
    # Étiquette fixée (tâche 036, audit 026 M4) : branche v3.6, celle en
    # service (3.6.1, image du 2025-11-13). Un pull ne suit que les
    # correctifs 3.6.x ; passer à une autre branche est une décision.
    image: traefik:v3.6
    container_name: traefik
    networks:
      - traefik-proxy # Pour la communication avec les autres services
      
    command:
      # --- Global & Providers ---
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false 
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      
      # --- API & Dashboard ---
      - --api=true
      - --api.dashboard=true
      # Pas de --api.insecure ni de routeur public : tableau de bord non exposé (tâche 026)
      
      # --- Entrypoints ---
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # --- Certificats (Let's Encrypt) ---
      - --certificatesresolvers.le.acme.email=bkeller@valaisweb.com # REMPLACER!
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme:/acme
      - ./dynamic:/etc/traefik/dynamic:ro
      
    restart: unless-stopped
    
    labels:
      - "traefik.enable=true"

      # Tableau de bord : plus de routeur public (tâche 026).
      # Middleware gardé pour une future redirection http -> https globale.
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

networks:
  traefik-proxy:
    external: true

