version: '3.9'

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    networks:
      - traefik-proxy # Pour la communication avec les autres services
      
    command:
      # --- Global & Providers ---
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false 
      
      # --- API & Dashboard ---
      - --api=true
      - --api.dashboard=true
      # Pas de --api.insecure ni de routeur public : tableau de bord non exposé (tâche 026)
      
      # --- Entrypoints ---
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # --- Certificats (Let's Encrypt) ---
      - --certificatesresolvers.le.acme.email=bkeller@valaisweb.com # REMPLACER!
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme:/acme
      
    restart: unless-stopped
    
    labels:
      - "traefik.enable=true"

      # Tableau de bord : plus de routeur public (tâche 026).
      # Middleware gardé pour une future redirection http -> https globale.
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

networks:
  traefik-proxy:
    external: true

